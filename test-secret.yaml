  username: dGVzdC11c2Vy            # test-user
  password: c3VwZXItc2VjcmV0LTEyMw== # super-secret-123
  
  # Database connection
  db-host: bG9jYWxob3N0            # localhost
  db-port: NTQzMg==                # 5432
