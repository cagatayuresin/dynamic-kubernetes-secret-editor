  # API keys
  api-key: YWJjZGVmZ2hpams=        # abcdefghijk
  secret-token: eHl6LXRva2VuLTc4OQ== # xyz-token-789
  
  # SSL certificates (example content)
  tls-cert: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # -----BEGIN CERTIFICATE-----
  tls-key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t   # -----BEGIN PRIVATE KEY-----
  
  # Configuration file (JSON)
  config-json: eyJzZXJ2ZXIiOiAibG9jYWxob3N0IiwgInBvcnQiOiA4MDgwfQ== # {"server": "localhost", "port": 8080}
