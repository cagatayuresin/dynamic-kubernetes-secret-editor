name: Release

# Held on purpose. Tag pushes do not publish a GitHub Release.
# Restore the tag trigger after the Sonar review:
#   on:
#     push:
#       tags: ['v*']
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "Release is held until the Sonar review. This workflow does not publish from a branch."
              exit 1
              ;;
          esac
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
