    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#3f72af">
    <link rel="canonical" href="https://cagatayuresin.github.io/dynamic-kubernetes-secret-editor/">
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
    <meta property="og:title" content="Dynamic Kubernetes Secret Editor">
    <meta property="og:description" content="Decode, edit, and export Kubernetes Secrets in the browser. Files stay on your machine.">
    <meta property="og:url" content="https://cagatayuresin.github.io/dynamic-kubernetes-secret-editor/">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dynamic Kubernetes Secret Editor">
    <meta name="twitter:description" content="Decode, edit, and export Kubernetes Secrets in the browser. Files stay on your machine.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Dynamic Kubernetes Secret Editor",
        "description": "Browser-local editor that decodes, edits, and exports Kubernetes Secrets.",
        "url": "https://cagatayuresin.github.io/dynamic-kubernetes-secret-editor/",
        "softwareVersion": "1.0.0",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web Browser",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Cagatay URESIN",
          "url": "https://cagatayuresin.com"
        }
      }
    </script>
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (error) {
          // Private browsing can block localStorage. The light theme stays.
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
